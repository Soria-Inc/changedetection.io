name: Build Soria container

on:
  push:
    branches:
      - codex/page-and-linked-files
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record source revision
        run: |
          printf '%s\n' "$GITHUB_SHA" > changedetectionio/source.txt
          printf '%s\n' "$GITHUB_REF" > changedetectionio/tag.txt

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/soria-inc/changedetection.io:soria-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Allow ECS to pull the image without registry credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /orgs/soria-inc/packages/container/changedetection.io
          -f visibility=public
