name: Build Soria container

on:
  push:
    branches:
      - codex/page-and-linked-files
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record source revision
        run: |
          printf '%s\n' "$GITHUB_SHA" > changedetectionio/source.txt
          printf '%s\n' "$GITHUB_REF" > changedetectionio/tag.txt

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/soria-inc/changedetection.io:soria-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Soria-Inc/changedetection.io
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Allow ECS to pull the image without registry credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /orgs/Soria-Inc/packages/container/changedetection.io
          -f visibility=public
